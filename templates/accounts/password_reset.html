{% extends "base.html" %}
{% block title %}Відновлення пароля{% endblock %}
{% block content %}
<div class="form-card">
  <h1 class="text-center">Відновлення пароля</h1>
  <p class="muted text-center">Вкажіть email — ми надішлемо посилання для зміни пароля.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
      <div class="form-row">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}{{ field.errors }}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary btn-block">Надіслати посилання</button>
  </form>
</div>
{% endblock %}
